name: Android build
on:
  pull_request:
    paths: ['android/**', '.github/workflows/android-build.yml']
  push:
    branches: ['android/play-setup']
    paths: ['android/**', '.github/workflows/android-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compile and lint unsigned release
        working-directory: android
        run: ./gradlew --no-daemon -PunsignedReleaseForVerification bundleRelease assembleRelease lintRelease
      - uses: actions/upload-artifact@v4
        with:
          name: StBrittos-unsigned-release
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/reports/lint-results-release.*
