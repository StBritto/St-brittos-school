name: Lighthouse Quality Check

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Start local site
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/lighthouse-server.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8080/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/lighthouse-server.log
          exit 1

      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@12.6.2
        with:
          urls: |
            http://127.0.0.1:8080/
          uploadArtifacts: true
          temporaryPublicStorage: false
